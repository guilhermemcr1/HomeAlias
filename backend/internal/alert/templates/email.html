<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{.Subject}}</title>
  <style>
    @media only screen and (max-width: 600px) {
      .email-gutter { padding: 16px 12px !important; }
      .email-content { padding: 24px 20px !important; }
      .email-title { font-size: 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#05070d;color:#eaf0ff;font-family:'Courier New',Courier,monospace;font-style:italic;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;" aria-hidden="true">{{.Subject}} — Notificação do HomeAlias.</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#05070d" style="width:100%;background-color:#05070d;">
    <tr>
      <td class="email-gutter" align="center" style="padding:40px 20px;">
        <!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;table-layout:fixed;">
          <tr>
            <td style="padding:0 0 24px;color:#4da3ff;font-size:26px;font-weight:bold;line-height:34px;">HomeAlias<span style="color:#8dc7ff;font-size:14px;font-weight:normal;"> / DDNS</span></td>
          </tr>
          <tr>
            <td class="email-content" bgcolor="#0d121c" style="padding:32px;background-color:#0d121c;border-top:2px solid #4da3ff;border-radius:6px;word-break:break-word;overflow-wrap:anywhere;">
              <p style="margin:0 0 16px;color:#8dc7ff;font-size:14px;line-height:22px;">Notificação por e-mail</p>
              <h1 class="email-title" style="margin:0 0 24px;color:#eaf0ff;font-size:28px;font-weight:bold;line-height:1.3;">{{.Subject}}</h1>
              {{range .Paragraphs}}<p style="margin:0 0 16px;color:#eaf0ff;font-size:16px;line-height:1.7;white-space:pre-line;">{{.}}</p>{{end}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 4px 0;color:#a9b6d6;font-size:12px;line-height:20px;word-break:break-word;">
              <p style="margin:0 0 8px;">HomeAlias · Gerenciamento de DNS dinâmico</p>
              <p style="margin:0;">Mensagem automática enviada pelo canal de e-mail configurado no HomeAlias.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
